          .ad{margin-top:26px;width:100%;max-width:340px;background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(56,189,248,.2));border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:18px;text-align:center;animation:up .8s .6s both}
