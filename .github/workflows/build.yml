          <script>
          const SRC='https://raw.githubusercontent.com/NiREvil/vless/main/sub/ProxyIP-Daily.md';
          const WANT={armenia:'Armenia',germany:'Germany',netherlands:'Netherlands'};
          const FLAG={Armenia:'🇦🇲',Germany:'🇩🇪',Netherlands:'🇳🇱'};
          const CF=['173.245.48.0/20','103.21.244.0/22','103.22.200.0/22','103.31.4.0/22','141.101.64.0/18','108.162.192.0/18','190.93.240.0/20','188.114.96.0/20','197.234.240.0/22','198.41.128.0/17','162.158.0.0/15','104.16.0.0/13','104.24.0.0/14','172.64.0.0/13','131.0.72.0/22'];
          const NATIVE=typeof Native!=='undefined';
          let ghItems=[],best=[],mode='gh',cfg=null,busy=false;
          const $=id=>document.getElementById(id);
          $('mode').textContent=NATIVE?'تست واقعی TCP+TLS ✓':'حالت تخمینی (مرورگر)';
          if(!NATIVE)$('mode').className='badge w';

          /* splash: exactly 5s */
          const msgs=['در حال آماده‌سازی...','اتصال به سرور لیست...','آماده‌سازی موتور اسکن...','تقریباً آماده‌ایم ⚡'];
          let mi=0;const tmr=setInterval(()=>{$('lt').textContent=msgs[++mi%msgs.length]},1250);
          setTimeout(()=>{$('splash').classList.add('h');clearInterval(tmr)},5000);

          function openUrl(u){NATIVE?Native.open(u):window.open(u,'_blank')}
          function copy(t){
            if(NATIVE)return Native.copy(t);
            if(navigator.clipboard)return navigator.clipboard.writeText(t).catch(()=>fb(t));
            fb(t);
          }
          function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}

          /* config */
          function parseCfg(s){
            const m=s.match(/^(vless|trojan):\/\/([^@]+)@(\[[^\]]+\]|[^:\/?#]+):(\d+)([^#]*)?(#.*)?$/i);
            if(!m)return null;
            const p=new URLSearchParams((m[5]||'').replace(/^\?/,''));
            const host=m[3],port=+m[4];
            const sni=p.get('sni')||p.get('host')||host;
            const hh=p.get('host')||sni;
            let path=p.get('path')||'/';try{path=decodeURIComponent(path)}catch(e){}
            if(!path.startsWith('/'))path='/'+path;
            const sec=(p.get('security')||'').toLowerCase();
            const tls=sec==='tls'||(sec!=='none'&&[443,2053,2083,2087,2096,8443].includes(port));
            return{scheme:m[1],host,port,sni,hh,path,tls,raw:s};
          }
          function chk(){
            const v=$('cfg').value.trim();cfg=parseCfg(v);
            const h=$('hint');
            if(cfg){h.style.color='var(--ok)';h.textContent='✅ کانفیگ معتبر — SNI: '+cfg.sni+' | پورت: '+cfg.port+' | '+(cfg.tls?'TLS':'بدون TLS')}
            else{h.style.color=v?'var(--bad)':'var(--m)';h.textContent=v?'❌ کانفیگ معتبر نیست (vless:// یا trojan://)':'اسکن فقط بعد از دادن کانفیگ فعال می‌شود و هر آیپی با همین کانفیگ تست می‌شود.'}
            $('go').disabled=!cfg||busy;
          }
          function setMode(m){
            mode=m;
            for(const k of['gh','cf','cu']){$('m-'+k).classList.toggle('on',k===m);$('x-'+k).style.display=k===m?'block':'none'}
            if(m==='gh'&&!ghItems.length)load();
          }

          /* github */
          function parseGh(md){
            const out=[],seen=new Set();let cur=null;
            for(const line of md.split('\n')){
              const l=line.toLowerCase();
              if(/^\s*#/.test(line)){cur=null;for(const k in WANT)if(l.includes(k))cur=WANT[k];continue}
              if(!cur)continue;
              for(const m of line.matchAll(/\b(\d{1,3}(?:\.\d{1,3}){3})(?::\d{2,5})?\b/g)){
                if(!seen.has(m[1])){seen.add(m[1]);out.push({ip:m[1],c:cur})}
              }
            }
            return out;
          }
          async function load(){
            const st=$('st');st.className='pulse';st.textContent='در حال دریافت لیست...';
            try{
              const r=await fetch(SRC+'?t='+Date.now(),{cache:'no-store'});
              if(!r.ok)throw 0;
              ghItems=parseGh(await r.text());
              if(!ghItems.length)throw 0;
              try{localStorage.setItem('pl2',JSON.stringify(ghItems))}catch(e){}
              st.textContent='✅ '+ghItems.length+' آیپی به‌روز شد';
            }catch(e){
              try{ghItems=JSON.parse(localStorage.getItem('pl2')||'[]')}catch(x){ghItems=[]}
              st.textContent=ghItems.length?'⚠️ آفلاین؛ لیست ذخیره‌شده ('+ghItems.length+')':'❌ دریافت لیست ناموفق';
            }
            st.className='';
            const n={};ghItems.forEach(i=>n[i.c]=(n[i.c]||0)+1);
            $('chips').textContent=Object.entries(n).map(([k,v])=>(FLAG[k]||'')+' '+k+': '+v).join('   ');
          }

          /* ranges */
          const ip2n=ip=>ip.split('.').reduce((a,x)=>a*256+(+x),0);
          const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
          function cidr(c){const[ip,l]=c.split('/');const size=Math.pow(2,32-(+l));return{base:Math.floor(ip2n(ip)/size)*size,size}}
          function rndIn(r){let n;do{n=r.base+Math.floor(Math.random()*r.size)}while((n&255)===0||(n&255)===255);return n}
          function cfCands(k){
            const rs=CF.map(cidr),tot=rs.reduce((a,r)=>a+r.size,0),set=new Set();let g=0;
            while(set.size<k&&g++<k*20){let x=Math.random()*tot,r=rs[0];for(const q of rs){if(x<q.size){r=q;break}x-=q.size}set.add(n2ip(rndIn(r)))}
            return[...set].map(ip=>({ip,c:null}));
          }
          function cuCands(txt){
            const set=new Set();
            for(let t of txt.split(/[\s,]+/)){
              t=t.trim().replace(/:\d+$/,'');if(!t)continue;
              if(/^\d{1,3}(\.\d{1,3}){3}\/\d{1,2}$/.test(t)){
                const r=cidr(t);
                if(r.size<=1024){for(let i=0;i<r.size;i++){const o=(r.base+i)&255;if(r.size<4||(o!==0&&o!==255))set.add(n2ip(r.base+i))}}
                else for(let i=0;i<500;i++)set.add(n2ip(rndIn(r)));
              }else if(/^\d{1,3}(\.\d{1,3}){3}$/.test(t))set.add(t);
            }
            return[...set].map(ip=>({ip,c:null}));
          }

          /* probes */
          const pend={};let nid=0;
          window.onTcp=(id,ms)=>{const f=pend[id];if(f){delete pend[id];f(ms<0?null:ms)}};
          window.onFull=(id,o)=>{const f=pend[id];if(f){delete pend[id];f(o)}};
          function tcp(it,to){
            return new Promise(res=>{
              const id='k'+(nid++);pend[id]=res;
              Native.tcp(id,it.ip,cfg.port,to);
              setTimeout(()=>{if(pend[id]){delete pend[id];res(null)}},to+1500);
            });
          }
          function full(it,to){
            return new Promise(res=>{
              const id='k'+(nid++);pend[id]=res;
              Native.full(id,it.ip,cfg.port,cfg.tls,cfg.sni,cfg.hh,cfg.path,to);
              setTimeout(()=>{if(pend[id]){delete pend[id];res(null)}},to+2000);
            });
          }
          function webProbe(it,to){
            return new Promise(res=>{
              const t0=performance.now(),ac=new AbortController();
              const tm=setTimeout(()=>{ac.abort();res(null)},to);
              fetch('https://'+it.ip+':'+cfg.port+'/cdn-cgi/trace',{mode:'no-cors',cache:'no-store',signal:ac.signal})
                .then(()=>{clearTimeout(tm);res(performance.now()-t0)})
                .catch(()=>{clearTimeout(tm);const d=performance.now()-t0;res(d<to-50?d:null)});
            });
          }
          async function pool(list,n,fn,onDone){
            let i=0,d=0;
            await Promise.all(Array.from({length:Math.min(n,list.length)},async()=>{
              while(i<list.length){const it=list[i++];await fn(it);onDone(++d)}
            }));
          }
          function prog(p,txt){
            $('fg').style.strokeDashoffset=339.3*(1-p);
            $('pct').textContent=Math.round(p*100)+'%';
            if(txt)$('ph').textContent=txt;
          }

          async function scan(){
            if(busy)return;
            if(!cfg){alert('اول کانفیگ معتبر بده');return}
            let cands;
            if(mode==='gh'){if(!ghItems.length)await load();cands=ghItems.slice()}
            else if(mode==='cf')cands=cfCands(+$('cfn').value);
            else cands=cuCands($('cus').value);
            if(!cands.length){alert(mode==='cu'?'رنج یا آیپی وارد کن':'لیستی برای اسکن نیست');return}

            busy=true;$('go').disabled=true;$('go').textContent='در حال اسکن...';
            $('out').style.display='none';$('rb').style.display='flex';prog(0,'مرحله ۱: بررسی اتصال '+cands.length+' آیپی');
            const alive=[];
            await pool(cands,NATIVE?40:15,async it=>{
              const r=NATIVE?await tcp(it,2000):await webProbe(it,2500);
              if(r!==null)alive.push({...it,tcp:r});
            },d=>prog(d/cands.length*0.65,'مرحله ۱: اتصال — سالم: '+alive.length));
            alive.sort((a,b)=>a.tcp-b.tcp);

            let ok=[];
            if(NATIVE){
              const top=alive.slice(0,40);
              prog(.65,'مرحله ۲: تست کامل با کانفیگ شما ('+top.length+' آیپی)');
              await pool(top,10,async it=>{
                const o=await full(it,4000);
                if(o&&o.status>0)ok.push({...it,...o,lat:o.total});
              },d=>prog(.65+d/Math.max(top.length,1)*.35,'مرحله ۲: تست TLS + کانفیگ — موفق: '+ok.length));
              ok.sort((a,b)=>((b.status===101)-(a.status===101))||a.lat-b.lat);
            }else ok=alive.map(a=>({...a,lat:a.tcp,status:0}));

            prog(1,'تمام شد');
            best=ok.slice(0,5).map(r=>({...r,link:merge(r)}));
            show(alive.length,cands.length);
            busy=false;$('go').disabled=!cfg;$('go').textContent='🚀 اسکن دوباره';
            setTimeout(()=>$('rb').style.display='none',900);
          }
          function merge(r){
            const m=cfg.raw.match(/^(vless|trojan):\/\/([^@]+)@(\[[^\]]+\]|[^:\/?#]+):(\d+)([^#]*)?(#.*)?$/i);
            const p=new URLSearchParams((m[5]||'').replace(/^\?/,''));
            if(!p.get('sni'))p.set('sni',cfg.sni);
            if(!p.get('host'))p.set('host',cfg.hh);
            let nm='cfg';try{if(m[6])nm=decodeURIComponent(m[6].slice(1))}catch(e){}
            return m[1]+'://'+m[2]+'@'+r.ip+':'+m[4]+'?'+p.toString()+'#'+encodeURIComponent(nm+'-'+(r.c||'CF')+'-'+r.ip);
          }
          function show(nAlive,nAll){
            $('out').style.display='block';
            $('list').innerHTML=best.length?best.map((b,i)=>{
              const cl=b.lat<300?'g':b.lat<700?'y':'r';
              const tag=b.status===101?'<span class="badge">WS ✓ کانفیگ کار می‌کند</span>':b.status>0?'<span class="badge w">پاسخ HTTP '+b.status+'</span>':'';
              return `<div class="res" style="animation-delay:${i*.12}s"><div class="rt"><span><span class="rank en">#${i+1}</span>${FLAG[b.c]||'🌐'} ${b.c||'Cloudflare'}</span><span class="lat ${cl}">${Math.round(b.lat)} ms</span></div><div class="rt" style="direction:ltr;margin-top:6px;color:var(--b)"><span>${b.ip}</span>${tag}</div><div class="lk">${b.link}</div><button class="sm" onclick="cp(${i},this)">📋 کپی کانفیگ</button></div>`;
            }).join('')+`<div class="ph">${nAlive} از ${nAll} آیپی سالم بود</div>`:`<div class="res">هیچ آیپی‌ای با کانفیگ شما کار نکرد (${nAlive} از ${nAll} فقط اتصال داشت). روش یا رنج دیگری امتحان کن.</div>`;
          }
          function cp(i,b){copy(best[i].link);b.textContent='✅ کپی شد';setTimeout(()=>b.textContent='📋 کپی کانفیگ',1500)}
          function copyAll(){copy(best.map(b=>b.link).join('\n'))}
          setMode('gh');chk();
          </script>
          </body>
          </html>
          ABULIX_EOF_7
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true
          echo "sdk.dir=$SDK" > "$GITHUB_WORKSPACE/proj/local.properties"
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: |
          cd "$GITHUB_WORKSPACE/proj"
          find . -type f -not -path './.gradle/*' | sort
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: ERROR SUMMARY (send me this)
        if: failure()
        run: |
          echo "========== ERROR SUMMARY =========="
          grep -n -B2 -A14 -E "What went wrong|error:|\.java:[0-9]+|AAPT|FAILURE" build.log | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: Abulix-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
