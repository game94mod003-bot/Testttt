name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate project files
        run: |
          P="$GITHUB_WORKSPACE/proj"
          rm -rf "$P"
          mkdir -p "$P"
          true
          cat > "$P/settings.gradle" <<'ABULIX_EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AbulixScanner"
          include ':app'
          ABULIX_EOF_0
          true
          cat > "$P/build.gradle" <<'ABULIX_EOF_1'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          ABULIX_EOF_1
          true
          cat > "$P/gradle.properties" <<'ABULIX_EOF_2'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2g
          ABULIX_EOF_2
          mkdir -p "$P/app"
          cat > "$P/app/build.gradle" <<'ABULIX_EOF_3'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.abulix.scanner'
              compileSdk 34
              defaultConfig {
                  applicationId "com.abulix.scanner"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              lint { abortOnError = false; checkReleaseBuilds = false }
          }
          ABULIX_EOF_3
          mkdir -p "$P/app/src/main"
          cat > "$P/app/src/main/AndroidManifest.xml" <<'ABULIX_EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application
                  android:label="Abulix Scanner"
                  android:icon="@drawable/ic_launcher"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ABULIX_EOF_4
          mkdir -p "$P/app/src/main/java/com/abulix/scanner"
          cat > "$P/app/src/main/java/com/abulix/scanner/Tunnel.java" <<'ABULIX_EOF_5'
          package com.abulix.scanner;

          import java.io.BufferedInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.EOFException;
          import java.io.IOException;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.net.SocketTimeoutException;
          import java.security.MessageDigest;
          import java.security.SecureRandom;
          import javax.net.ssl.SSLSocket;
          import javax.net.ssl.SSLSocketFactory;

          /** Minimal VLESS / Trojan over WebSocket (optionally TLS) client used to test that data really passes. */
          final class Tunnel {

              static final class Cfg {
                  boolean vless;
                  byte[] uuid;
                  String password = "";
                  int port;
                  boolean tls;
                  String sni;
                  String host;
                  String path;
              }

              static final class Res {
                  long ttfb = -1;
                  int status;
                  long bytes;
                  long firstLen;
                  long dlMs;
              }

              private static final SecureRandom RND = new SecureRandom();
              private final Cfg cfg;
              private Socket sock;
              private OutputStream out;
              private BufferedInputStream in;
              private boolean respHdrDone;
              long setupMs;

              Tunnel(Cfg c) {
                  cfg = c;
              }

              static long ms(long t0) {
                  return (System.nanoTime() - t0) / 1000000L;
              }

              private static String b64(byte[] d) {
                  String a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < d.length; i += 3) {
                      int b0 = d[i] & 255;
                      int b1 = i + 1 < d.length ? d[i + 1] & 255 : 0;
                      int b2 = i + 2 < d.length ? d[i + 2] & 255 : 0;
                      int n = (b0 << 16) | (b1 << 8) | b2;
                      sb.append(a.charAt((n >> 18) & 63)).append(a.charAt((n >> 12) & 63));
                      sb.append(i + 1 < d.length ? a.charAt((n >> 6) & 63) : '=');
                      sb.append(i + 2 < d.length ? a.charAt(n & 63) : '=');
                  }
                  return sb.toString();
              }

              private static String sha224hex(String s) throws Exception {
                  MessageDigest md = MessageDigest.getInstance("SHA-224");
                  byte[] h = md.digest(s.getBytes("UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  for (byte b : h) {
                      sb.append(String.format("%02x", b & 255));
                  }
                  return sb.toString();
              }

              /** TCP + optional TLS (SNI) + WebSocket upgrade to the given edge IP. */
              void open(String ip, int timeoutMs) throws Exception {
                  long t0 = System.nanoTime();
                  Socket raw = new Socket();
                  raw.setTcpNoDelay(true);
                  raw.connect(new InetSocketAddress(ip, cfg.port), timeoutMs);
                  raw.setSoTimeout(timeoutMs);
                  sock = raw;
                  Socket s = raw;
                  if (cfg.tls) {
                      SSLSocketFactory f = (SSLSocketFactory) SSLSocketFactory.getDefault();
                      SSLSocket ss = (SSLSocket) f.createSocket(raw, cfg.sni, cfg.port, true);
                      ss.startHandshake();
                      s = ss;
                      sock = ss;
                  }
                  out = s.getOutputStream();
                  in = new BufferedInputStream(s.getInputStream(), 16384);

                  byte[] kb = new byte[16];
                  RND.nextBytes(kb);
                  String req = "GET " + cfg.path + " HTTP/1.1\r\nHost: " + cfg.host
                          + "\r\nUser-Agent: Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36"
                          + "\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: " + b64(kb)
                          + "\r\nSec-WebSocket-Version: 13\r\n\r\n";
                  out.write(req.getBytes("UTF-8"));
                  out.flush();

                  StringBuilder sb = new StringBuilder();
                  int c;
                  while ((c = in.read()) != -1) {
                      sb.append((char) c);
                      int l = sb.length();
                      if (l > 8192) {
                          throw new IOException("ws header too big");
                      }
                      if (l >= 4 && sb.charAt(l - 1) == '\n' && sb.charAt(l - 2) == '\r'
                              && sb.charAt(l - 3) == '\n' && sb.charAt(l - 4) == '\r') {
                          break;
                      }
                  }
                  String head = sb.toString();
                  String first = head.split("\r\n")[0];
                  String[] p = first.split(" ");
                  if (p.length < 2 || !p[1].equals("101")) {
                      throw new IOException("ws:" + first);
                  }
                  setupMs = ms(t0);
              }

              private void sendFrame(byte[] p) throws IOException {
                  ByteArrayOutputStream f = new ByteArrayOutputStream(p.length + 14);
                  f.write(0x82);
                  int len = p.length;
                  if (len < 126) {
                      f.write(0x80 | len);
                  } else if (len < 65536) {
                      f.write(0x80 | 126);
                      f.write(len >> 8);
                      f.write(len & 255);
                  } else {
                      f.write(0x80 | 127);
                      for (int i = 7; i >= 0; i--) {
                          f.write((int) (((long) len >> (8 * i)) & 255));
                      }
                  }
                  byte[] mask = new byte[4];
                  RND.nextBytes(mask);
                  f.write(mask, 0, 4);
                  byte[] m = new byte[len];
                  for (int i = 0; i < len; i++) {
                      m[i] = (byte) (p[i] ^ mask[i & 3]);
                  }
                  f.write(m, 0, len);
                  out.write(f.toByteArray());
                  out.flush();
              }

              private int readB() throws IOException {
                  int v = in.read();
                  if (v < 0) {
                      throw new EOFException();
                  }
                  return v;
              }

              private void readFully(byte[] b) throws IOException {
                  int o = 0;
                  while (o < b.length) {
                      int r = in.read(b, o, b.length - o);
                      if (r < 0) {
                          throw new EOFException();
                      }
                      o += r;
                  }
              }

              /** Next WebSocket data payload, or null when the peer closed. */
              private byte[] readFrame() throws IOException {
                  while (true) {
                      int b0 = in.read();
                      if (b0 < 0) {
                          return null;
                      }
                      int b1 = in.read();
                      if (b1 < 0) {
                          return null;
                      }
                      int op = b0 & 15;
                      boolean masked = (b1 & 128) != 0;
                      long len = b1 & 127;
                      if (len == 126) {
                          int h = readB();
                          int l = readB();
                          len = (h << 8) | l;
                      } else if (len == 127) {
                          len = 0;
                          for (int i = 0; i < 8; i++) {
                              len = (len << 8) | readB();
                          }
                      }
                      byte[] mk = null;
                      if (masked) {
                          mk = new byte[4];
                          readFully(mk);
                      }
                      if (len > (1L << 25)) {
                          throw new IOException("frame too big");
                      }
                      byte[] p = new byte[(int) len];
                      readFully(p);
                      if (masked) {
                          for (int i = 0; i < p.length; i++) {
                              p[i] = (byte) (p[i] ^ mk[i & 3]);
                          }
                      }
                      if (op == 8) {
                          return null;
                      }
                      if (op == 9 || op == 10) {
                          continue;
                      }
                      return p;
                  }
              }

              /** Next chunk of tunnel payload with the VLESS response header removed; null on EOF. */
              private byte[] recv() throws IOException {
                  while (true) {
                      byte[] p = readFrame();
                      if (p == null) {
                          return null;
                      }
                      if (!cfg.vless || respHdrDone) {
                          if (p.length == 0) {
                              continue;
                          }
                          return p;
                      }
                      if (p.length < 2) {
                          throw new IOException("short vless header");
                      }
                      int skip = 2 + (p[1] & 255);
                      if (p.length < skip) {
                          throw new IOException("short vless addons");
                      }
                      respHdrDone = true;
                      if (p.length == skip) {
                          continue;
                      }
                      byte[] r = new byte[p.length - skip];
                      System.arraycopy(p, skip, r, 0, r.length);
                      return r;
                  }
              }

              private void connectTarget(String host, int port, byte[] first) throws Exception {
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  byte[] hb = host.getBytes("UTF-8");
                  if (cfg.vless) {
                      b.write(0);
                      b.write(cfg.uuid, 0, 16);
                      b.write(0);
                      b.write(1);
                      b.write(port >> 8);
                      b.write(port & 255);
                      b.write(2);
                      b.write(hb.length);
                      b.write(hb, 0, hb.length);
                  } else {
                      byte[] h = sha224hex(cfg.password).getBytes("UTF-8");
                      b.write(h, 0, h.length);
                      b.write('\r');
                      b.write('\n');
                      b.write(1);
                      b.write(3);
                      b.write(hb.length);
                      b.write(hb, 0, hb.length);
                      b.write(port >> 8);
                      b.write(port & 255);
                      b.write('\r');
                      b.write('\n');
                  }
                  if (first != null) {
                      b.write(first, 0, first.length);
                  }
                  sendFrame(b.toByteArray());
              }

              private static int parseStatus(byte[] p) {
                  try {
                      String s = new String(p, 0, Math.min(p.length, 24), "ISO-8859-1");
                      if (!s.startsWith("HTTP/")) {
                          return 0;
                      }
                      String[] a = s.split(" ");
                      return a.length > 1 ? Integer.parseInt(a[1].trim()) : 0;
                  } catch (Exception e) {
                      return 0;
                  }
              }

              /** HTTP GET through the tunnel. Reads until maxBytes / maxMs / EOF. */
              Res fetch(String host, int port, String path, long maxMs, long maxBytes) throws Exception {
                  String http = "GET " + path + " HTTP/1.1\r\nHost: " + host
                          + "\r\nUser-Agent: Mozilla/5.0 (Linux; Android 13)\r\nAccept: */*\r\nConnection: close\r\n\r\n";
                  long t0 = System.nanoTime();
                  connectTarget(host, port, http.getBytes("UTF-8"));
                  Res r = new Res();
                  byte[] p = recv();
                  if (p == null) {
                      throw new IOException("no data");
                  }
                  r.ttfb = ms(t0);
                  r.bytes = p.length;
                  r.firstLen = p.length;
                  r.status = parseStatus(p);
                  long t1 = System.nanoTime();
                  long last = t1;
                  while (r.bytes < maxBytes && ms(t0) < maxMs) {
                      try {
                          p = recv();
                      } catch (SocketTimeoutException e) {
                          break;
                      }
                      if (p == null) {
                          break;
                      }
                      r.bytes += p.length;
                      last = System.nanoTime();
                  }
                  r.dlMs = (last - t1) / 1000000L;
                  return r;
              }

              void close() {
                  try {
                      if (sock != null) {
                          sock.close();
                      }
                  } catch (Exception e) {
                      // ignore
                  }
              }
          }
          ABULIX_EOF_5
          mkdir -p "$P/app/src/main/java/com/abulix/scanner"
          cat > "$P/app/src/main/java/com/abulix/scanner/Checks.java" <<'ABULIX_EOF_6'
          package com.abulix.scanner;

          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.util.Locale;

          /** Test routines. Every method returns a small JSON string (or "ip:ms" for tcp) and never throws. */
          final class Checks {

              static Tunnel.Cfg cfg(String type, String id, int port, boolean tls, String sni, String host, String path) {
                  Tunnel.Cfg c = new Tunnel.Cfg();
                  c.vless = "vless".equalsIgnoreCase(type);
                  if (c.vless) {
                      String h = id.replace("-", "");
                      byte[] b = new byte[16];
                      for (int i = 0; i < 16; i++) {
                          b[i] = (byte) Integer.parseInt(h.substring(2 * i, 2 * i + 2), 16);
                      }
                      c.uuid = b;
                  } else {
                      c.password = id;
                  }
                  c.port = port;
                  c.tls = tls;
                  c.sni = sni;
                  c.host = host;
                  c.path = (path == null || path.length() == 0) ? "/" : path;
                  return c;
              }

              static String san(Throwable t) {
                  String m = t.getClass().getSimpleName() + ":" + t.getMessage();
                  m = m.replaceAll("[^A-Za-z0-9 :._/-]", "_");
                  return m.length() > 70 ? m.substring(0, 70) : m;
              }

              private static void close(Tunnel t) {
                  if (t != null) {
                      t.close();
                  }
              }

              /** Real TCP connect time. */
              static String tcp(String ip, int port, int timeout) {
                  long t = System.nanoTime();
                  Socket s = new Socket();
                  try {
                      s.connect(new InetSocketAddress(ip, port), timeout);
                      return ip + ":" + Tunnel.ms(t);
                  } catch (Throwable e) {
                      return null;
                  } finally {
                      try {
                          s.close();
                      } catch (Throwable x) {
                          // ignore
                      }
                  }
              }

              private static long site(String ip, Tunnel.Cfg c, String host) {
                  Tunnel t = null;
                  try {
                      t = new Tunnel(c);
                      t.open(ip, 3500);
                      Tunnel.Res r = t.fetch(host, 80, "/", 4000, 1);
                      return r.status > 0 ? r.ttfb : -1;
                  } catch (Throwable e) {
                      return -1;
                  } finally {
                      close(t);
                  }
              }

              /** Opens the tunnel, checks data really passes (generate_204), then measures latency to YouTube/Telegram/fast.com. */
              static String tunnel(String ip, Tunnel.Cfg c) {
                  long setup = -1;
                  long gen = -1;
                  long yt = -1;
                  long tg = -1;
                  long fa = -1;
                  String err = "";
                  boolean ok = false;
                  Tunnel t = null;
                  try {
                      t = new Tunnel(c);
                      t.open(ip, 3500);
                      setup = t.setupMs;
                      Tunnel.Res r = t.fetch("connectivitycheck.gstatic.com", 80, "/generate_204", 4500, 1);
                      if (r.status > 0) {
                          ok = true;
                          gen = r.ttfb;
                      } else {
                          err = "nohttp";
                      }
                  } catch (Throwable e) {
                      err = san(e);
                  } finally {
                      close(t);
                  }
                  if (ok) {
                      yt = site(ip, c, "www.youtube.com");
                      tg = site(ip, c, "telegram.org");
                      fa = site(ip, c, "fast.com");
                  }
                  return "{\"ip\":\"" + ip + "\",\"ok\":" + ok + ",\"setup\":" + setup + ",\"gen\":" + gen
                          + ",\"yt\":" + yt + ",\"tg\":" + tg + ",\"fast\":" + fa + ",\"err\":\"" + err + "\"}";
              }

              private static final String[][] SRC = {
                  {"speedtest.tele2.net", "/10MB.zip", "tele2"},
                  {"ipv4.download.thinkbroadband.com", "/10MB.zip", "thinkbb"},
                  {"cachefly.cachefly.net", "/10mb.test", "cachefly"}
              };

              /** Download speed through the tunnel (plain HTTP test files). */
              static String speed(String ip, Tunnel.Cfg c, int seconds) {
                  String err = "";
                  for (String[] s : SRC) {
                      Tunnel t = null;
                      try {
                          t = new Tunnel(c);
                          t.open(ip, 3500);
                          Tunnel.Res r = t.fetch(s[0], 80, s[1], seconds * 1000L, 30L * 1024 * 1024);
                          long body = r.bytes - r.firstLen;
                          if (r.status == 200 && body > 50000 && r.dlMs > 0) {
                              double mbps = body * 8.0 / (r.dlMs * 1000.0);
                              return "{\"ip\":\"" + ip + "\",\"mbps\":" + String.format(Locale.US, "%.2f", mbps)
                                      + ",\"mb\":" + String.format(Locale.US, "%.2f", r.bytes / 1048576.0)
                                      + ",\"src\":\"" + s[2] + "\",\"err\":\"\"}";
                          }
                          err = "status" + r.status + " bytes" + r.bytes;
                      } catch (Throwable e) {
                          err = san(e);
                      } finally {
                          close(t);
                      }
                  }
                  return "{\"ip\":\"" + ip + "\",\"mbps\":0,\"mb\":0,\"src\":\"\",\"err\":\"" + err.replace("\"", "_") + "\"}";
              }
          }
          ABULIX_EOF_6
          mkdir -p "$P/app/src/main/java/com/abulix/scanner"
          cat > "$P/app/src/main/java/com/abulix/scanner/MainActivity.java" <<'ABULIX_EOF_7'
          package com.abulix.scanner;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.concurrent.ConcurrentLinkedQueue;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicInteger;

          public class MainActivity extends Activity {

              private WebView web;
              private volatile boolean cancel = false;
              private PowerManager.WakeLock wl;

              interface Task {
                  String run(String ip) throws Exception;
              }

              private void js(final String code) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (web != null) {
                              web.evaluateJavascript(code, null);
                          }
                      }
                  });
              }

              private static String q(String s) {
                  return "'" + s.replace("\\", "\\\\").replace("'", "\\'").replace("\n", "\\n").replace("\r", "") + "'";
              }

              private void keepOn(final boolean on) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (on) {
                                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                                  if (wl == null) {
                                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "abulix:scan");
                                  }
                                  if (!wl.isHeld()) {
                                      wl.acquire(2 * 60 * 60 * 1000L);
                                  }
                              } else {
                                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                                  if (wl != null && wl.isHeld()) {
                                      wl.release();
                                  }
                              }
                          } catch (Throwable e) {
                              // ignore
                          }
                      }
                  });
              }

              private static long lat(String s) {
                  int i = s.lastIndexOf(':');
                  try {
                      return Long.parseLong(s.substring(i + 1));
                  } catch (Exception e) {
                      return Long.MAX_VALUE;
                  }
              }

              private static String finish(String kind, ConcurrentLinkedQueue<String> res) {
                  ArrayList<String> l = new ArrayList<String>(res);
                  boolean quote = false;
                  if (kind.equals("tcp")) {
                      quote = true;
                      Collections.sort(l, new java.util.Comparator<String>() {
                          @Override
                          public int compare(String a, String b) {
                              return Long.compare(lat(a), lat(b));
                          }
                      });
                      if (l.size() > 800) {
                          l = new ArrayList<String>(l.subList(0, 800));
                      }
                  }
                  StringBuilder sb = new StringBuilder("[");
                  for (int i = 0; i < l.size(); i++) {
                      if (i > 0) {
                          sb.append(',');
                      }
                      if (quote) {
                          sb.append('"').append(l.get(i)).append('"');
                      } else {
                          sb.append(l.get(i));
                      }
                  }
                  return sb.append(']').toString();
              }

              private static String[] split(String csv) {
                  ArrayList<String> l = new ArrayList<String>();
                  for (String s : csv.split(",")) {
                      String t = s.trim();
                      if (t.length() > 0) {
                          l.add(t);
                      }
                  }
                  return l.toArray(new String[0]);
              }

              private void job(final String kind, final String[] ips, final int threads, final Task task) {
                  cancel = false;
                  keepOn(true);
                  final int nt = Math.max(1, Math.min(threads, 600));
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          final ExecutorService ex = Executors.newFixedThreadPool(nt, new java.util.concurrent.ThreadFactory() {
                              @Override
                              public Thread newThread(final Runnable r) {
                                  Thread t = new Thread(new Runnable() {
                                      @Override
                                      public void run() {
                                          try {
                                              android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_FOREGROUND);
                                          } catch (Throwable e) {
                                              // ignore
                                          }
                                          r.run();
                                      }
                                  });
                                  t.setDaemon(true);
                                  return t;
                              }
                          });
                          final AtomicInteger cnt = new AtomicInteger();
                          final AtomicInteger okc = new AtomicInteger();
                          final ConcurrentLinkedQueue<String> res = new ConcurrentLinkedQueue<String>();
                          final int total = ips.length;
                          for (final String ip : ips) {
                              ex.execute(new Runnable() {
                                  @Override
                                  public void run() {
                                      try {
                                          if (!cancel) {
                                              String r = task.run(ip);
                                              if (r != null) {
                                                  res.add(r);
                                                  if (!r.contains("\"ok\":false")) {
                                                      okc.incrementAndGet();
                                                  }
                                              }
                                          }
                                      } catch (Throwable e) {
                                          // ignore
                                      }
