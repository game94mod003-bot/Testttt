name: Build Psiphone abulix APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Download Vazirmatn font (optional)
        run: |
          mkdir -p app/src/main/assets/fonts
          for f in Regular:vazir Bold:vazir-bold; do
            w=${f%%:*}; n=${f##*:}
            curl -fsSL -o app/src/main/assets/fonts/$n.ttf "https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/ttf/Vazirmatn-$w.ttf" \
              || curl -fsSL -o app/src/main/assets/fonts/$n.ttf "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              || true
            if [ -f app/src/main/assets/fonts/$n.ttf ] && [ "$(stat -c%s app/src/main/assets/fonts/$n.ttf)" -lt 20000 ]; then rm -f app/src/main/assets/fonts/$n.ttf; fi
          done
          ls -la app/src/main/assets/fonts || true

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias abulix \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass abulix123 -keypass abulix123 \
            -dname "CN=Psiphone abulix, O=abulix, C=IR" || true

      - name: Build APK (release first, debug as fallback)
        run: |
          gradle assembleRelease --stacktrace || {
            echo "Release failed, building debug instead";
            gradle assembleDebug --stacktrace;
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PsiphoneAbulix-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
