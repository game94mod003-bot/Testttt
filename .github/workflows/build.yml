          }
          function chk(){
            const v=$('cfg').value.trim();cfg=parseCfg(v);
            try{localStorage.setItem('abx_cfg',v)}catch(e){}
            const h=$('hint');
            if(cfg&&!cfg.idOk){h.style.color='var(--bad)';h.textContent='❌ UUID/پسورد کانفیگ معتبر نیست'}
            else if(cfg&&cfg.tunnel){h.style.color='var(--ok)';h.textContent='✅ معتبر — تست کامل رد داده فعال است | SNI: '+cfg.sni+' | پورت '+cfg.port+(cfg.tls?' (TLS)':'')}
            else if(cfg){h.style.color='var(--warn)';h.textContent='⚠️ نوع '+cfg.net+(cfg.sec==='reality'?'/reality':'')+' پشتیبانی تست رد داده ندارد؛ فقط اتصال TCP بررسی می‌شود (WebSocket پیشنهاد می‌شود)'}
            else{h.style.color=v?'var(--bad)':'var(--m)';h.textContent=v?'❌ کانفیگ معتبر نیست (vless:// یا trojan://)':'هر آیپی با همین کانفیگ تست می‌شود تا مطمئن شویم داده واقعاً رد می‌شود. (WebSocket پیشنهاد می‌شود)'}
            $('go').disabled=!(cfg&&cfg.idOk)||!NATIVE||running;
          }
          function setMode(m){
            mode=m;
            for(const k of['gh','cf','cu']){$('m-'+k).classList.toggle('on',k===m);$('x-'+k).style.display=k===m?'block':'none'}
            if(m==='gh'&&!ghItems.length)load();
          }
          function setPower(p){power=p;for(const k of['normal','high','max'])$('p-'+k).classList.toggle('on',k===p)}

          /* ---------- github list ---------- */
          function parseGh(md){
            const out=[],seen=new Set();let cur=null;
            for(const line of md.split('\n')){
              const l=line.toLowerCase();
              if(/^\s*#/.test(line)){cur=null;for(const k in WANT)if(l.includes(k))cur=WANT[k];continue}
              if(!cur)continue;
              for(const m of line.matchAll(/\b(\d{1,3}(?:\.\d{1,3}){3})(?::\d{2,5})?\b/g)){
                if(!seen.has(m[1])){seen.add(m[1]);out.push({ip:m[1],c:cur})}
              }
            }
            return out;
          }
          async function load(){
            const st=$('st');st.className='pulse';st.textContent='در حال دریافت لیست...';
            try{
              const r=await fetch(SRC+'?t='+Date.now(),{cache:'no-store'});
              if(!r.ok)throw 0;
              ghItems=parseGh(await r.text());
              if(!ghItems.length)throw 0;
              try{localStorage.setItem('abx_gh',JSON.stringify(ghItems))}catch(e){}
              st.textContent='✅ '+ghItems.length+' آیپی به‌روز شد';
            }catch(e){
              try{ghItems=JSON.parse(localStorage.getItem('abx_gh')||'[]')}catch(x){ghItems=[]}
              st.textContent=ghItems.length?'⚠️ آفلاین؛ لیست ذخیره‌شده ('+ghItems.length+')':'❌ دریافت لیست ناموفق';
            }
            st.className='';
            ghMap={};ghItems.forEach(x=>ghMap[x.ip]=x.c);
            const n={};ghItems.forEach(i=>n[i.c]=(n[i.c]||0)+1);
            $('chips').textContent=Object.entries(n).map(([k,v])=>(FLAG[k]||'')+' '+k+': '+v).join('   ');
          }

          /* ---------- ranges ---------- */
          const ip2n=ip=>ip.split('.').reduce((a,x)=>a*256+(+x),0);
          const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
          function cidr(c){const[ip,l]=c.split('/');const size=Math.pow(2,32-(+l));return{base:Math.floor(ip2n(ip)/size)*size,size}}
          function rndIn(r){let n;do{n=r.base+Math.floor(Math.random()*r.size)}while((n&255)===0||(n&255)===255);return n}
          function cfCands(k){
            const rs=CF.map(cidr),tot=rs.reduce((a,r)=>a+r.size,0),set=new Set();let g=0;
            while(set.size<k&&g++<k*6){let x=Math.random()*tot,r=rs[0];for(const q of rs){if(x<q.size){r=q;break}x-=q.size}set.add(n2ip(rndIn(r)))}
            return[...set];
          }
          function cuCands(txt){
            const set=new Set();
            for(let t of txt.split(/[\s,]+/)){
              if(set.size>=MAXIP)break;
              t=t.trim().replace(/:\d+$/,'');if(!t)continue;
              if(/^\d{1,3}(\.\d{1,3}){3}\/\d{1,2}$/.test(t)){
                if(+t.split('/')[1]<8)continue;
                const r=cidr(t);
                if(r.size<=65536){for(let i=0;i<r.size&&set.size<MAXIP;i++){const o=(r.base+i)&255;if(r.size<4||(o!==0&&o!==255))set.add(n2ip(r.base+i))}}
                else for(let i=0;i<20000&&set.size<MAXIP;i++)set.add(n2ip(rndIn(r)));
              }else if(/^\d{1,3}(\.\d{1,3}){3}$/.test(t))set.add(t);
            }
            return[...set];
          }

          /* ---------- native job plumbing ---------- */
          let jobResolve=null,stageBase=0,stageSpan=0,stageName='';
          function setRing(p){const v=Math.max(0,Math.min(1,p));$('pb').style.width=(v*100)+'%';$('pct').textContent=Math.round(v*100)+'%'}
          function stage(name,base,span){stageName=name;stageBase=base;stageSpan=span;setRing(base);$('ph').textContent=name}
          window.onProg=(k,d,t,ok)=>{
            if(!running)return;
            setRing(stageBase+stageSpan*(t?d/t:1));
            $('ph').textContent=stageName+' — '+d.toLocaleString()+' / '+t.toLocaleString();
            $('okc').textContent=ok.toLocaleString();
          };
          window.onJobDone=(k,s)=>{const r=jobResolve;jobResolve=null;if(r){let v=[];try{v=JSON.parse(s)}catch(e){}r(v)}};
          function runJob(fn){return new Promise(res=>{jobResolve=res;try{fn()}catch(e){jobResolve=null;res([])}})}
          const tunnelJob=(csv,th)=>runJob(()=>Native.tunnelBatch(csv,cfg.scheme,cfg.id,cfg.port,cfg.tls,cfg.sni,cfg.hh,cfg.path,th));
          const speedJob=(csv,sec,th)=>runJob(()=>Native.speedBatch(csv,cfg.scheme,cfg.id,cfg.port,cfg.tls,cfg.sni,cfg.hh,cfg.path,sec,th));

          /* ---------- helpers ---------- */
          function avgLat(o){const v=[o.yt,o.tg,o.fast].filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b)/v.length:(o.gen>0?o.gen:99999)}
          function lp(v){return v>0?`<span class="pl ${v<250?'g':v<600?'y':'r'}">${v}ms</span>`:'<span class="pl r">✗</span>'}
          function mb(v){return v>0?v.toFixed(1):'—'}
          function merge(ip,c){
            const m=cfg.raw.match(/^(vless|trojan):\/\/([^@]+)@(\[[^\]]+\]|[^:\/?#]+):(\d+)([^#]*)?(#.*)?$/i);
            const p=new URLSearchParams((m[5]||'').replace(/^\?/,''));
            if(!p.get('sni'))p.set('sni',cfg.sni);
            if(!p.get('host'))p.set('host',cfg.hh);
            let nm='cfg';try{if(m[6])nm=decodeURIComponent(m[6].slice(1))}catch(e){}
            return m[1]+'://'+m[2]+'@'+ip+':'+m[4]+'?'+p.toString()+'#'+encodeURIComponent(nm+'-'+(c||'CF')+'-'+ip);
          }
          let elTimer=null,t0=0;
          function startTimer(){t0=Date.now();clearInterval(elTimer);elTimer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('el').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500)}
          function stopTimer(){clearInterval(elTimer)}
          function ui(on){
            running=on;
            $('go').style.display=on?'none':'block';
            $('stop').style.display=on?'block':'none';
            $('live').style.display='block';
            $('go').disabled=!(cfg&&cfg.idOk)||!NATIVE||on;
          }
          function stopScan(){stopped=true;try{Native.cancel()}catch(e){}$('ph').textContent='در حال توقف...'}

          function showBase(b){
            const c=$('base');c.style.display='block';
            const t=b.t,s=b.s;
            if(t&&t.ok){
              c.innerHTML=`<div class="ct">🔎 کانفیگ اصلی شما</div><div class="chips"><span class="badge">✅ رد داده OK</span>YT ${lp(t.yt)} TG ${lp(t.tg)} FAST ${lp(t.fast)} ${s&&s.mbps>0?'<span class="pl g">'+s.mbps+' Mbps</span>':''}</div>`;
            }else{
              c.innerHTML=`<div class="ct">🔎 کانفیگ اصلی شما</div><div class="warn" style="margin:0">❌ با آدرس خود کانفیگ هم رد داده تایید نشد${t&&t.err?' (دلیل: '+t.err+')':''}. اسکن ادامه پیدا می‌کند؛ اگر آیپی‌ها هم رد نشدند، کانفیگ/سرور مشکل دارد.</div>`;
            }
          }

          /* ---------- main scan ---------- */
          async function scan(){
            if(running||!cfg||!cfg.idOk||!NATIVE)return;
            let ips;
            if(mode==='gh'){if(!ghItems.length)await load();ips=ghItems.map(x=>x.ip)}
            else if(mode==='cf')ips=cfCands(+$('cfn').value);
            else ips=cuCands($('cus').value);
            if(!ips.length){alert(mode==='cu'?'آیپی یا رنج وارد کن':'لیستی برای اسکن نیست');return}

            stopped=false;ui(true);startTimer();
            $('out').style.display='none';$('base').style.display='none';$('okc').textContent='0';setRing(0);
            const P=PW[power];
            let alive=[],okList=[],spdMap={},errs={};
            try{
              if(cfg.tunnel){
                stage('بررسی کانفیگ اصلی',0,0.05);
                const o=await tunnelJob(cfg.host,1);
                let sp=null;
                if(o[0]&&o[0].ok&&!stopped){const s=await speedJob(cfg.host,4,1);sp=s[0]||null}
                showBase({t:o[0]||null,s:sp});
              }
              if(!stopped){
                stage('مرحله ۱: بررسی اتصال '+ips.length.toLocaleString()+' آیپی',0.05,0.45);
                const arr=await runJob(()=>Native.scanTcp(ips.join(','),cfg.port,1500,P.tcp));
                alive=arr.map(s=>{const i=s.lastIndexOf(':');return{ip:s.slice(0,i),tcp:+s.slice(i+1)}});
              }
              if(!stopped&&alive.length&&cfg.tunnel){
                const cand=alive.slice(0,P.keep).map(a=>a.ip);
                stage('مرحله ۲: تست رد داده + پینگ یوتیوب/تلگرام/FAST',0.5,0.3);
                const tun=await tunnelJob(cand.join(','),P.tun);
                okList=tun.filter(o=>o.ok);
                tun.filter(o=>!o.ok).forEach(o=>{const k=o.err||'?';errs[k]=(errs[k]||0)+1});
              }
              if(!stopped&&okList.length){
                okList.sort((a,b)=>avgLat(a)-avgLat(b));
                const top=okList.slice(0,12).map(o=>o.ip);
                stage('مرحله ۳: تست سرعت دانلود ('+top.length+' آیپی)',0.8,0.2);
                const spd=await speedJob(top.join(','),5,2);
                spd.forEach(s=>{spdMap[s.ip]=s});
              }
              setRing(1);$('ph').textContent=stopped?'متوقف شد':'تمام شد ✅';
            }catch(e){
              $('ph').textContent='خطا: '+(e&&e.message?e.message:e);
            }
            stopTimer();ui(false);$('go').textContent='🚀 اسکن دوباره';
            render(alive,okList,spdMap,errs);
          }

          function render(alive,okList,spdMap,errs){
            $('out').style.display='block';
            const cmp=$('cmp'),list=$('list');
            if(cfg.tunnel&&okList.length){
              const rows=okList.map(o=>({...o,mbps:(spdMap[o.ip]&&spdMap[o.ip].mbps)||0,lat:avgLat(o)}));
              rows.sort((a,b)=>(b.mbps-a.mbps)||(a.lat-b.lat));
              best=rows.slice(0,5).map(r=>({ip:r.ip,link:merge(r.ip,ghMap[r.ip])}));
              const mx=Math.max(1,...rows.map(r=>r.mbps));
              cmp.innerHTML='<table><tr><th>#</th><th>IP</th><th>YouTube</th><th>Telegram</th><th>FAST</th><th>Mbps</th></tr>'+
                rows.slice(0,8).map((r,i)=>`<tr><td>${i+1}</td><td style="font-size:11px">${r.ip}</td><td>${lp(r.yt)}</td><td>${lp(r.tg)}</td><td>${lp(r.fast)}</td><td><b>${mb(r.mbps)}</b><div class="sp"><i style="width:${r.mbps/mx*100}%"></i></div></td></tr>`).join('')+'</table>';
              list.innerHTML=rows.slice(0,5).map((r,i)=>{
                const c=ghMap[r.ip];
                return `<div class="res ${i===0?'top':''}" style="animation-delay:${i*.1}s"><div class="rt"><span><span class="rank en">#${i+1}</span>${FLAG[c]||'🌐'} ${c||'Cloudflare'}</span><span class="badge">✅ رد داده تایید شد</span></div>
          <div class="rt" style="margin-top:8px"><span class="big en">${r.mbps>0?r.mbps.toFixed(1):'—'} <small style="font-size:12px">Mbps</small></span><span style="direction:ltr;color:var(--m);font-size:12px">${r.ip}</span></div>
          <div class="chips">YT ${lp(r.yt)} TG ${lp(r.tg)} FAST ${lp(r.fast)}<span class="pl g">setup ${r.setup}ms</span></div>
          <div class="lk">${best[i].link}</div><button class="sm" onclick="cp(${i},this)">📋 کپی کانفیگ</button></div>`;
              }).join('')+`<div class="ph">${okList.length} آیپی رد داده داشتند از ${alive.length} آیپی سالم</div>`;
              return;
            }
            cmp.innerHTML='';
            if(!alive.length){best=[];list.innerHTML='<div class="res">هیچ آیپی‌ای به پورت '+cfg.port+' وصل نشد. روش یا رنج دیگری امتحان کن.</div>';return}
            const top=alive.slice(0,5);
            best=top.map(a=>({ip:a.ip,link:merge(a.ip,ghMap[a.ip])}));
            let why='';
            if(!cfg.tunnel)why='این نوع کانفیگ پشتیبانی تست رد داده ندارد؛ فقط اتصال TCP بررسی شد.';
            else if(stopped)why='اسکن متوقف شد؛ نتایج فقط اتصال TCP هستند.';
            else{
              const e=Object.entries(errs).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]+' ×'+x[1]).join(' | ');
              why='هیچ آیپی‌ای رد داده را پاس نکرد'+(e?' (دلیل‌ها: '+e+')':'')+'. نتایج زیر فقط اتصال TCP دارند و تایید‌نشده‌اند.';
            }
            list.innerHTML=`<div class="warn">${why}</div>`+top.map((a,i)=>`<div class="res"><div class="rt"><span><span class="rank en">#${i+1}</span>${FLAG[ghMap[a.ip]]||'🌐'} ${ghMap[a.ip]||'Cloudflare'}</span><span class="badge w">فقط TCP ${a.tcp}ms</span></div><div class="lk">${best[i].link}</div><button class="sm" onclick="cp(${i},this)">📋 کپی کانفیگ</button></div>`).join('');
          }
          function cp(i,b){copy(best[i].link);b.textContent='✅ کپی شد';setTimeout(()=>b.textContent='📋 کپی کانفیگ',1500)}
          function copyAll(){if(best.length)copy(best.map(b=>b.link).join('\n'))}

          try{const sv=localStorage.getItem('abx_cfg');if(sv)$('cfg').value=sv}catch(e){}
          setPower('max');setMode('gh');chk();
          </script>
          </body>
          </html>
          ABULIX_EOF_9
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true
          echo "sdk.dir=$SDK" > "$GITHUB_WORKSPACE/proj/local.properties"
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: |
          cd "$GITHUB_WORKSPACE/proj"
          find . -type f -not -path './.gradle/*' | sort
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: ERROR SUMMARY (send me this)
        if: failure()
        run: |
          echo "========== ERROR SUMMARY =========="
          grep -n -B2 -A14 -E "What went wrong|error:|\.java:[0-9]+|AAPT|FAILURE" build.log | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: Abulix-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
