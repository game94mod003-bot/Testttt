plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.abulix.psiphone'
    compileSdk 34

    defaultConfig {
        applicationId "ir.abulix.psiphone"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ks = file("release.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword "abulix123"
                keyAlias "abulix"
                keyPassword "abulix123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
    }
}
