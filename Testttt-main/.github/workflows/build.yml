name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true
          echo "sdk.dir=$SDK" > local.properties
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: ERROR SUMMARY
        if: failure()
        run: grep -n -B2 -A14 -E "What went wrong|error:|\.java:[0-9]+|AAPT|FAILURE" build.log | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: Abulix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (only when pushing a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/debug/app-debug.apk --title "Abulix Scanner $GITHUB_REF_NAME" --notes "Debug-signed installable APK" 
